            <!--
                Jak přidat fotografii:
                1. Nahrajte obrázek do složky images/galerie/ (ideálně ve formátu WebP).
                2. Zkopírujte jeden blok <figure class="gallery-item"> ... </figure> níže.
                3. Vyměňte src="..." za cestu ke svému obrázku a alt="..." za krátký popis.
                4. Atribut loading="lazy" nechte – zajišťuje, že se obrázek načte až
                   ve chvíli, kdy k němu uživatel doroluje (rychlejší načítání stránky).
                5. Po kliknutí na fotografii se otevře zvětšený náhled (lightbox).
                   Volitelně můžete přidat atribut data-full="cesta/k/velke-fotce.webp",
                   aby se v náhledu zobrazila verze ve vyšším rozlišení.
            -->
            <div class="gallery-grid">
                <!-- PLACEHOLDER 1 – nahraďte vlastní fotografií -->
                <figure class="gallery-item">
                    <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='300'%3E%3Crect%20fill='%23e9ecef'%20width='400'%20height='300'/%3E%3Ctext%20x='50%25'%20y='50%25'%20fill='%23868e96'%20font-family='sans-serif'%20font-size='22'%20text-anchor='middle'%20dominant-baseline='middle'%3EFotografie%201%3C/text%3E%3C/svg%3E"
                        alt="Ukázkový placeholder – nahraďte popisem fotografie" loading="lazy" width="400"
                        height="300">
                    <figcaption>Popisek fotografie (nepovinné)</figcaption>
                </figure>

                <!-- PLACEHOLDER 2 – nahraďte vlastní fotografií -->
                <figure class="gallery-item">
                    <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='300'%3E%3Crect%20fill='%23e9ecef'%20width='400'%20height='300'/%3E%3Ctext%20x='50%25'%20y='50%25'%20fill='%23868e96'%20font-family='sans-serif'%20font-size='22'%20text-anchor='middle'%20dominant-baseline='middle'%3EFotografie%202%3C/text%3E%3C/svg%3E"
                        alt="Ukázkový placeholder – nahraďte popisem fotografie" loading="lazy" width="400"
                        height="300">
                    <figcaption>Popisek fotografie (nepovinné)</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <!-- Lightbox pro zvětšení fotografie (otevírá se kliknutím na obrázek v galerii) -->
