name: Link Check

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "events.json"
      - ".github/workflows/link-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "events.json"
      - ".github/workflows/link-check.yml"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate internal links
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          html_files = sorted(root.glob("*.html"))
          attr_pattern = re.compile(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']', re.IGNORECASE)

          broken = []

          for html_file in html_files:
              text = html_file.read_text(encoding="utf-8")
              for raw_link in attr_pattern.findall(text):
                  link = raw_link.strip()
                  if not link or link.startswith(("http://", "https://", "mailto:", "tel:", "javascript:", "data:")):
                      continue
                  if link.startswith("#"):
                      continue

                  path_part = link.split("#", 1)[0].split("?", 1)[0]
                  if not path_part:
                      continue

                  if path_part.startswith("/"):
                      target = root / path_part.lstrip("/")
                  else:
                      target = (html_file.parent / path_part).resolve()

                  if not target.exists():
                      broken.append(f"{html_file.name}: {raw_link}")

          if broken:
              print("Broken internal links:")
              for item in broken:
                  print(f"- {item}")
              sys.exit(1)

          print(f"OK: checked {len(html_files)} HTML files, no broken internal links.")
          PY

